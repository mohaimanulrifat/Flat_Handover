<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="A room-by-room checklist for flat handover day, with a PDF defect report."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%APP_TITLE%" />
    <title>%APP_TITLE%</title>
    <script>
      // Apply the saved theme before the page draws (see src/lib/theme.ts).
      try {
        var light = localStorage.getItem("handover-check:theme") === "light";
        document.documentElement.dataset.theme = light ? "light" : "dark";
        if (light)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#f4f2ec");
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
